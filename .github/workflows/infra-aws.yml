name: AWS Infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
  pull_request:
    paths:
      - 'infra/aws/**'
  workflow_dispatch:

# HOME-344: one run at a time per ref. Without this, two merges to main in quick
# succession run side by side and can deploy out of order (the older commit
# finishing last and winning) while both show green. On main (push and
# workflow_dispatch share refs/heads/main) a new run queues behind the one in
# progress rather than cancelling it, so a deploy is never cut off halfway.
# On a PR a new push cancels the now-stale run, as nothing deploys from a PR.
# NB GitHub holds at most one pending run per group: a third merge supersedes
# (cancels) the queued second one before it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infra/aws

    steps:
      - uses: actions/checkout@v4

      # GCP auth — needed to read/write the GCS state backend
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # AWS auth — keyless OIDC using the role created by the bootstrap apply
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply tfplan
