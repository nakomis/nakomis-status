name: Deploy

on:
  push:
    branches: [main]

# HOME-344: one run at a time per ref. Without this, two merges to main in quick
# succession run side by side and can deploy out of order (the older commit
# finishing last and winning) while both show green. A new run queues behind
# the one in progress rather than cancelling it, so a deploy is never cut off
# halfway. This workflow has no pull_request trigger, so nothing is ever
# cancelled; the expression is kept so the block matches the other repos.
# NB GitHub holds at most one pending run per group: a third merge supersedes
# (cancels) the queued second one before it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Build image and push to Artifact Registry
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nakomis-status/app:${{ github.sha }}
        run: |
          docker build -t $IMAGE web/
          docker push $IMAGE

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nakomis-status/app:${{ github.sha }}
        run: |
          gcloud run services update nakomis-status \
            --image=$IMAGE \
            --region=${{ secrets.GCP_REGION }}

  # The Status panel of nakomis-shell (app.{env}/status). Its data still comes from this Cloud Run service.
  deploy-remote:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - env: sandbox
            account: '975050268859'
          - env: prod
            account: '637423226886'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:remote
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account }}:role/nakomis-nakomis-status-remote-ci-${{ matrix.env }}
          aws-region: eu-west-2
      - name: Publish to remotes/status
        run: |
          set -euo pipefail
          bucket=$(aws ssm get-parameter --name /nakomis-shell/${{ matrix.env }}/bucket-name --query Parameter.Value --output text)
          distribution=$(aws ssm get-parameter --name /nakomis-shell/${{ matrix.env }}/distribution-id --query Parameter.Value --output text)
          aws s3 sync dist-remote/assets "s3://$bucket/remotes/status/assets/" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist-remote "s3://$bucket/remotes/status/" --exclude "assets/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths "/remotes/status/*" --query Invalidation.Id --output text
